name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q mistralfit
      - run: python -m unittest discover -v
      - run: python -m mistralfit doctor --json
      - name: Parse PowerShell entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Install and exercise the wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/mistralfit-wheel-check
          /tmp/mistralfit-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/mistralfit-wheel-check/bin/mistralfit --version
          /tmp/mistralfit-wheel-check/bin/mistralfit doctor --json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: dist/*
